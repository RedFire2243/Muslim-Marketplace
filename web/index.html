<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover services, jobs, internships, mentors, collaborators, volunteering and local businesses in the Muslim community of Central Jersey.">
  <meta name="theme-color" content="#0B5D4B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Muslim Marketplace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Muslim Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FAF7F2; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; font-family: system-ui, sans-serif; color: #4F5752;
    }
    #boot .mark { width: 56px; height: 56px; border-radius: 16px; background: #0B5D4B; }
    #boot noscript { max-width: 320px; text-align: center; }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="mark"></div>
    <noscript>Muslim Marketplace needs JavaScript to run.</noscript>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
